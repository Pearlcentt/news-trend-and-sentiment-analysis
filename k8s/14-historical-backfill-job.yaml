apiVersion: batch/v1
kind: Job
metadata:
  name: historical-backfill-jan2025
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 86400 # Keep logs for 24h
  template:
    spec:
      containers:
        - name: crawler
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install requests beautifulsoup4 pymongo feedparser confluent-kafka avro-python3 --quiet

              echo "Starting Historical Backfill (Jan 1, 2025 to Now)..."
              python3 /app/crawler/historical_crawler.py --start-date 2025-01-01 --end-date 2025-12-31 --per-day 50 --output mongodb

          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: code-volume
              mountPath: /app/crawler

      restartPolicy: Never

      volumes:
        - name: code-volume
          configMap:
            name: historical-crawler-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: historical-crawler-script
  namespace: news-pipeline
data:
  historical_crawler.py: |
    """
    Historical News Data Crawler
    Fetches historical news from multiple archive sources:
    1. GDELT Project (free global API)
    2. Live Scraping (requests + bs4) for content
    """
    import os
    import sys
    import json
    import hashlib
    import argparse
    import logging
    from datetime import datetime, timedelta
    from typing import List, Dict, Any, Optional
    from urllib.parse import urlparse
    import time

    import requests
    from bs4 import BeautifulSoup
    import urllib3
    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)  # Suppress SSL warnings

    # Try to import optional dependencies
    try:
        from pymongo import MongoClient
        HAS_MONGO = True
    except ImportError:
        HAS_MONGO = False

    # Configuration
    MONGODB_URI = os.getenv('MONGODB_URI', 'mongodb://mongodb:27017')
    GDELT_BASE_URL = "https://api.gdeltproject.org/api/v2/doc/doc"

    # Setup logging
    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s - %(levelname)s - %(message)s'
    )
    LOG = logging.getLogger(__name__)


    class GDELTCrawler:
        """
        Crawler for GDELT Project v2 API
        """
        
        def __init__(self):
            self.base_url = GDELT_BASE_URL
            self.session = requests.Session()
            self.session.verify = False  # Disable SSL to fix certificate error
            self.session.headers.update({
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'
            })
        
        def search(
            self,
            query: str = "",
            start_date: datetime = None,
            end_date: datetime = None,
            max_records: int = 250,
            source_lang: str = "english"
        ) -> List[Dict[str, Any]]:
            """
            Search GDELT for articles (English only)
            """
            # Format dates for GDELT
            if start_date:
                start_str = start_date.strftime("%Y%m%d%H%M%S")
            else:
                start_str = (datetime.now() - timedelta(days=1)).strftime("%Y%m%d%H%M%S")
            
            if end_date:
                end_str = end_date.strftime("%Y%m%d%H%M%S")
            else:
                end_str = datetime.now().strftime("%Y%m%d%H%M%S")
            
            # Filter to major English news domains for quality English content
            english_domains = "domain:bbc.com OR domain:cnn.com OR domain:theguardian.com OR domain:reuters.com OR domain:npr.org OR domain:foxnews.com OR domain:nytimes.com OR domain:washingtonpost.com OR domain:apnews.com"
            full_query = f"({english_domains})"
            
            params = {
                "query": full_query,
                "mode": "artlist",
                "maxrecords": str(max_records),
                "format": "json",
                "startdatetime": start_str,
                "enddatetime": end_str,
            }
            
            try:
                response = self.session.get(self.base_url, params=params, timeout=30)
                response.raise_for_status()
                data = response.json()
                
                articles = []
                for item in data.get("articles", []):
                    article = self._parse_gdelt_article(item)
                    if article:
                        articles.append(article)
                
                LOG.info(f"GDELT: Found {len(articles)} articles for {start_date.strftime('%Y-%m-%d') if start_date else 'recent'}")
                return articles
                
            except requests.RequestException as e:
                LOG.error(f"GDELT API error: {e}")
                return []
            except json.JSONDecodeError:
                LOG.error("GDELT returned invalid JSON")
                return []
        
        def _parse_gdelt_article(self, item: Dict) -> Optional[Dict[str, Any]]:
            """Parse GDELT article to our schema (English only)"""
            try:
                # Skip non-English articles
                language = item.get("language", "").lower()
                if language and language != "english":
                    return None
                
                url = item.get("url", "")
                domain = urlparse(url).netloc.replace("www.", "")
                
                # Parse date
                date_str = item.get("seendate", "")
                if date_str:
                    try:
                        event_time = datetime.strptime(date_str, "%Y%m%dT%H%M%SZ")
                    except ValueError:
                        event_time = datetime.now()
                else:
                    event_time = datetime.now()
                
                title = item.get("title", "")
                if not title:
                    return None
                
                article = {
                    "article_id": f"gdelt_{hashlib.md5(url.encode()).hexdigest()[:16]}",
                    "source_domain": domain,
                    "title": title,
                    "body_text": "", # Will be filled by scraper
                    "url": url,
                    "published_at": int(event_time.timestamp() * 1000),
                    "event_time": int(event_time.timestamp() * 1000),
                    "ingest_time": int(datetime.now().timestamp() * 1000),
                    "language": item.get("language", "English"),
                    "section": item.get("domain", "general"),
                    "tags": [],
                    "content_hash_md5": hashlib.md5(title.encode()).hexdigest(),
                    "source": "gdelt",
                    "original_image": item.get("socialimage", "")
                }
                return article
            except Exception as e:
                LOG.warning(f"Error parsing GDELT article: {e}")
                return None
        
        def scrape_content(self, url: str) -> str:
            """Scrape article content from URL"""
            try:
                response = self.session.get(url, timeout=10)
                if response.status_code == 200:
                    soup = BeautifulSoup(response.content, 'html.parser')
                    # Remove scripts and styles
                    for script in soup(["script", "style", "nav", "footer", "header"]):
                        script.decompose()
                    
                    # Get text from paragraphs
                    paragraphs = soup.find_all('p')
                    text = ' '.join([p.get_text().strip() for p in paragraphs])
                    return text[:5000] if text else ""
            except Exception as e:
                LOG.debug(f"Scrape failed for {url}: {e}")
            return ""

        def crawl_date_range(
            self,
            start_date: datetime,
            end_date: datetime,
            query: str = "",
            articles_per_day: int = 100,
            incremental_storage = None
        ) -> List[Dict[str, Any]]:
            """Crawl articles for a date range with optional incremental storage"""
            all_articles = []
            current_date = start_date
            
            while current_date <= end_date:
                next_date = current_date + timedelta(days=1)
                
                articles = self.search(
                    query=query,
                    start_date=current_date,
                    end_date=next_date,
                    max_records=min(articles_per_day, 250)
                )
                
                # Enrich with content
                valid_articles = []
                for a in articles:
                    LOG.info(f"Scraping: {a['title'][:30]}...")
                    content = self.scrape_content(a['url'])
                    
                    if content:
                         a['body_text'] = content
                    else:
                         a['body_text'] = f"Content unavailable. Original Link: {a['url']} (Archive checked: No content)"
                    
                    valid_articles.append(a)
                    # Small delay to be polite
                    time.sleep(0.2)
                
                all_articles.extend(valid_articles)
                LOG.info(f"Date {current_date.strftime('%Y-%m-%d')}: {len(valid_articles)} scraped")
                
                # INCREMENTAL SAVE: Store each day's articles immediately
                if incremental_storage and valid_articles:
                    try:
                        incremental_storage.store(valid_articles)
                        LOG.info(f"  -> Saved {len(valid_articles)} articles to MongoDB")
                    except Exception as e:
                        LOG.error(f"  -> Failed to save: {e}")
                
                current_date = next_date
                time.sleep(1)
            
            return all_articles


    class HistoricalDataStorage:
        """Storage handler for historical articles"""
        
        def __init__(self, output_type: str = "mongodb"):
            self.output_type = output_type
            self.mongo_client = None
            
            if output_type == "mongodb" and HAS_MONGO:
                try:
                    self.mongo_client = MongoClient(MONGODB_URI)
                    LOG.info(f"Connected to MongoDB: {MONGODB_URI}")
                except Exception as e:
                    LOG.error(f"MongoDB connection failed: {e}")
        
        def store(self, articles: List[Dict[str, Any]]):
            """Store articles to configured backend"""
            if not articles:
                LOG.warning("No articles to store")
                return
            
            if self.output_type == "mongodb" and self.mongo_client:
                self._store_mongodb(articles)
            else:
                LOG.warning(f"Unknown output type: {self.output_type}")
        
        def _store_mongodb(self, articles: List[Dict[str, Any]]):
            """Store to MongoDB"""
            try:
                db = self.mongo_client["news_analytics"]
                
                # Insert articles
                if articles:
                    for article in articles:
                        # Ensure we have some content (fallback for offline mode)
                        if not article.get('body_text'):
                             article['body_text'] = f"Content for {article['title']} (from GDELT Archive)"
                        
                        db.historical_articles.update_one(
                            {"article_id": article["article_id"]},
                            {"$set": article},
                            upsert=True
                        )
                    LOG.info(f"Stored {len(articles)} articles to MongoDB")
                
                # Update realtime stats for dashboard visibility
                self._update_realtime_db(articles)
                
            except Exception as e:
                LOG.error(f"MongoDB storage error: {e}")
        
        def _update_realtime_db(self, articles: List[Dict[str, Any]]):
            """Update news_rt database for Streamlit dashboard"""
            try:
                db_rt = self.mongo_client["news_rt"]
                
                # Add recent articles to processed_news
                recent = articles[-100:] if len(articles) > 100 else articles
                for a in recent:
                    # Use the article's actual published date, not current time
                    pub_time = a.get('published_at') or a.get('event_time')
                    if isinstance(pub_time, (int, float)):
                        pub_datetime = datetime.fromtimestamp(pub_time / 1000)
                    else:
                        pub_datetime = datetime.now()
                    
                    db_rt.processed_news.update_one(
                        {"article_id": a["article_id"]},
                        {"$set": {
                            "source_domain": a.get("source_domain", "unknown"),
                            "title": a.get("title", ""),
                            "sentiment": "neutral",
                            "published_at": pub_time,  # Store original timestamp
                            "event_time": pub_time,    # Also store as event_time for consistency
                            "process_time": pub_datetime,  # Use article's date, not now()
                            "content": a.get('body_text', '') 
                        }},
                        upsert=True
                    )
            except Exception as e:
                LOG.error(f"Error updating realtime db: {e}")


    def main():
        parser = argparse.ArgumentParser(description="Historical News Crawler")
        parser.add_argument("--start-date", type=str, default=None, help="Start date (YYYY-MM-DD)")
        parser.add_argument("--end-date", type=str, default=None, help="End date (YYYY-MM-DD)")
        parser.add_argument("--days", type=int, default=None, help="Number of days back from today (alternative to --start-date/--end-date)")
        parser.add_argument("--per-day", type=int, default=100, help="Articles per day (max 250)")
        parser.add_argument("--output", choices=["mongodb", "json"], default="mongodb", help="Output destination")
        args = parser.parse_args()
        
        # Determine date range
        if args.start_date and args.end_date:
            start_date = datetime.strptime(args.start_date, "%Y-%m-%d")
            end_date = datetime.strptime(args.end_date, "%Y-%m-%d")
        elif args.days:
            end_date = datetime.now()
            start_date = end_date - timedelta(days=args.days)
        else:
            # Default: last 7 days
            end_date = datetime.now()
            start_date = end_date - timedelta(days=7)
        
        print("=" * 60)
        print("HISTORICAL NEWS CRAWLER (BACKFILL)")
        print(f"Date range: {start_date.strftime('%Y-%m-%d')} to {end_date.strftime('%Y-%m-%d')}")
        print(f"Limit: {args.per_day} articles/day")
        print("=" * 60)
        
        # Create storage for incremental saves
        storage = HistoricalDataStorage(args.output)
        
        # 1. Crawl from GDELT with INCREMENTAL storage
        print(f"\n[1/1] Crawling GDELT Project ({start_date.date()} to {end_date.date()})...")
        print("  -> INCREMENTAL SAVE MODE: Articles saved after each day")
        gdelt = GDELTCrawler()
        all_articles = gdelt.crawl_date_range(
            start_date=start_date,
            end_date=end_date,
            articles_per_day=args.per_day,
            incremental_storage=storage  # Pass storage for incremental saves
        )
        
        print("\n" + "=" * 60)
        print("BACKFILL COMPLETE")
        print("=" * 60)


    if __name__ == "__main__":
        main()
