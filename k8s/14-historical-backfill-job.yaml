# Historical Backfill Job
# Runs crawler/historical_crawler.py for past data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: historical-backfill-jan2025
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 86400 # Keep logs for 24h
  template:
    spec:
      containers:
        - name: crawler
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install requests beautifulsoup4 pymongo feedparser --quiet
              export PYTHONPATH="/app"
              echo "Starting Historical Backfill (Jan 1, 2025 to Now)..."
              python3 /app/crawler/historical_crawler.py --start-date 2025-01-01 --end-date 2025-12-31 --per-day 50 --output mongodb
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: crawler-code
              mountPath: /app/crawler
      volumes:
        - name: crawler-code
          configMap:
            name: crawler-code
      restartPolicy: Never
  backoffLimit: 2
