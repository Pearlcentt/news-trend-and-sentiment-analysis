---
# Cassandra Deployment for Kubernetes
# Provides hot data storage for real-time trends (alternative/complement to MongoDB)
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-config
  namespace: news-pipeline
data:
  # Cassandra initialization script
  init.cql: |
    -- Create keyspace for news data
    CREATE KEYSPACE IF NOT EXISTS news_rt
    WITH REPLICATION = {
      'class': 'SimpleStrategy',
      'replication_factor': 1
    };
    
    USE news_rt;
    
    -- Real-time trends table (wide row per topic/window)
    CREATE TABLE IF NOT EXISTS rt_trends (
      topic_token TEXT,
      window_start TIMESTAMP,
      article_count INT,
      avg_sentiment DOUBLE,
      unique_sources INT,
      top_article_ids LIST<TEXT>,
      PRIMARY KEY ((topic_token), window_start)
    ) WITH CLUSTERING ORDER BY (window_start DESC);
    
    -- Real-time sentiment by source
    CREATE TABLE IF NOT EXISTS rt_sentiment_by_source (
      source_domain TEXT,
      bucket_date DATE,
      window_start TIMESTAMP,
      article_count INT,
      avg_sentiment DOUBLE,
      PRIMARY KEY ((source_domain, bucket_date), window_start)
    ) WITH CLUSTERING ORDER BY (window_start DESC);
    
    -- Latest articles for quick lookup
    CREATE TABLE IF NOT EXISTS latest_articles (
      article_id TEXT PRIMARY KEY,
      source_domain TEXT,
      title TEXT,
      sentiment_label TEXT,
      sentiment_polarity DOUBLE,
      published_at TIMESTAMP,
      ingested_at TIMESTAMP
    );

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: news-pipeline
spec:
  serviceName: "cassandra"
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:4.1
        ports:
        - containerPort: 9042
          name: cql
        - containerPort: 7000
          name: intra
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "news-cluster"
        - name: CASSANDRA_DC
          value: "dc1"
        - name: CASSANDRA_RACK
          value: "rack1"
        - name: CASSANDRA_ENDPOINT_SNITCH
          value: "GossipingPropertyFileSnitch"
        - name: MAX_HEAP_SIZE
          value: "512M"
        - name: HEAP_NEWSIZE
          value: "256M"
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
        - name: cassandra-config
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "cqlsh -e 'describe cluster'"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "nodetool status"
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: cassandra-config
        configMap:
          name: cassandra-config
  volumeClaimTemplates:
  - metadata:
      name: cassandra-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: news-pipeline
spec:
  selector:
    app: cassandra
  ports:
  - name: cql
    port: 9042
    targetPort: 9042
  - name: intra
    port: 7000
    targetPort: 7000
  clusterIP: None

---
# Job to initialize Cassandra schema after startup
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
  namespace: news-pipeline
spec:
  template:
    spec:
      containers:
      - name: init
        image: cassandra:4.1
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Cassandra to be ready..."
          until cqlsh cassandra 9042 -e "describe cluster" 2>/dev/null; do
            sleep 10
          done
          echo "Cassandra ready, running init script..."
          cqlsh cassandra 9042 -f /init/init.cql
          echo "Schema initialized!"
        volumeMounts:
        - name: init-script
          mountPath: /init
      restartPolicy: OnFailure
      volumes:
      - name: init-script
        configMap:
          name: cassandra-config
  backoffLimit: 5
