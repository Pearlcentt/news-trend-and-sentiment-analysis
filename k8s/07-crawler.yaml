apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler
  namespace: news-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler
  template:
    metadata:
      labels:
        app: crawler
    spec:
      containers:
        - name: crawler
          image: news-crawler:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://sr-service:8081"
            - name: CRAWL_INTERVAL
              value: "60"
          volumeMounts:
            - name: crawler-config
              mountPath: /app/config
            # CRITICAL: Mount persistent volume for crawler state
            - name: crawler-state
              mountPath: /app/state
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os; exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: crawler-config
          configMap:
            name: crawler-config
        # CRITICAL: Persistent volume for crawler state (seen URLs)
        - name: crawler-state
          persistentVolumeClaim:
            claimName: crawler-state-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-config
  namespace: news-pipeline
data:
  config.kafka.yaml: |
    kafka:
      bootstrap_servers: "kafka-broker:9092"
      topic: "news_raw"
      client_id: "news-crawler"
      security_protocol: "PLAINTEXT"
    schema_registry:
      url: "http://sr-service:8081"
      subject: "news_raw-value"
      schema_path: "/app/schemas/news_raw.avsc"
    crawler:
      poll_interval_seconds: 60
      request_timeout: 15
      max_retries: 3
      state_store: "/app/state/crawler_state.json"
      default_country: "US"
      default_feed_name: "general"
      schema_version: 3
    feeds:
      # Technology
      - name: "techcrunch"
        url: "https://techcrunch.com/feed/"
        section: "Technology"
        category: "Tech News"
        language: "en"
      - name: "ars_technica"
        url: "https://feeds.arstechnica.com/arstechnica/index"
        section: "Technology"
        category: "Tech Analysis"
        language: "en"
      - name: "wired"
        url: "https://www.wired.com/feed/rss"
        section: "Technology"
        category: "Tech Culture"
        language: "en"
      - name: "the_verge"
        url: "https://www.theverge.com/rss/index.xml"
        section: "Technology"
        category: "Tech Products"
        language: "en"
      # World News
      - name: "bbc_world"
        url: "http://feeds.bbci.co.uk/news/world/rss.xml"
        section: "World"
        category: "International"
        language: "en"
      - name: "guardian_world"
        url: "https://www.theguardian.com/world/rss"
        section: "World"
        category: "Global Affairs"
        language: "en"
      - name: "reuters_world"
        url: "https://www.reutersagency.com/feed/?best-topics=world"
        section: "World"
        category: "Breaking News"
        language: "en"
      - name: "cnn_world"
        url: "http://rss.cnn.com/rss/edition_world.rss"
        section: "World"
        category: "Global News"
        language: "en"
      # Business
      - name: "reuters_business"
        url: "https://www.reutersagency.com/feed/?best-topics=business-finance"
        section: "Business"
        category: "Finance"
        language: "en"
      # Sports
      - name: "espn"
        url: "https://www.espn.com/espn/rss/news"
        section: "Sports"
        category: "Sports News"
        language: "en"
      - name: "bbc_sports"
        url: "http://feeds.bbci.co.uk/sport/rss.xml"
        section: "Sports"
        category: "Sports"
        language: "en"
      # Science
      - name: "science_daily"
        url: "https://www.sciencedaily.com/rss/all.xml"
        section: "Science"
        category: "Science News"
        language: "en"
      # Entertainment
      - name: "variety"
        url: "https://variety.com/feed/"
        section: "Entertainment"
        category: "Movies"
        language: "en"
      # Politics
      - name: "bbc_politics"
        url: "http://feeds.bbci.co.uk/news/politics/rss.xml"
        section: "Politics"
        category: "UK Politics"
        language: "en"
