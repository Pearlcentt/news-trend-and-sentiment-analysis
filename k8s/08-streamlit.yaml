apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-dashboard
  namespace: news-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-dashboard
  template:
    metadata:
      labels:
        app: streamlit-dashboard
    spec:
      containers:
        - name: streamlit
          image: news-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker:9092"
            - name: MONGODB_HOST
              value: "mongodb"
            - name: MONGODB_PORT
              value: "27017"
            - name: SCHEMA_REGISTRY_URL
              value: "http://sr-service:8081"
            - name: LANG
              value: "C.UTF-8"
            - name: LC_ALL
              value: "C.UTF-8"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: dashboard-code
              mountPath: /app/app.py
              subPath: app.py
      volumes:
        - name: dashboard-code
          configMap:
            name: dashboard-code
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-dashboard
  namespace: news-pipeline
spec:
  type: NodePort
  selector:
    app: streamlit-dashboard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
      name: http
