apiVersion: batch/v1
kind: Job
metadata:
  name: data-quality-check
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      containers:
        - name: quality-checker
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install pymongo pandas --quiet
              python3 << 'PYEND'
              """
              Great Expectations Formal Checkpoint
              Validates news data and generates JSON data docs
              """
              from datetime import datetime, timedelta
              from typing import Dict, List, Any, Optional
              from pymongo import MongoClient
              import pandas as pd
              import json
              import os

              class ExpectationResult:
                  def __init__(self, success, expectation_type, column=None, details=None):
                      self.success = success
                      self.expectation_type = expectation_type
                      self.column = column
                      self.details = details or {}
                      self.timestamp = datetime.now().isoformat()
                  
                  def to_dict(self):
                      return {
                          'success': self.success,
                          'expectation_type': self.expectation_type,
                          'column': self.column,
                          'details': self.details,
                          'timestamp': self.timestamp
                      }

              class ValidationResult:
                  def __init__(self, suite_name):
                      self.suite_name = suite_name
                      self.results = []
                      self.run_time = datetime.now().isoformat()
                      self.success = True
                  
                  def add_result(self, result):
                      self.results.append(result)
                      if not result.success:
                          self.success = False
                  
                  @property
                  def statistics(self):
                      total = len(self.results)
                      passed = sum(1 for r in self.results if r.success)
                      return {
                          'total_expectations': total,
                          'passed': passed,
                          'failed': total - passed,
                          'success_rate': passed / total if total > 0 else 0.0
                      }

              class NewsDataExpectations:
                  def __init__(self, suite_name="news_data_suite"):
                      self.suite_name = suite_name
                  
                  def validate(self, df):
                      result = ValidationResult(self.suite_name)
                      
                      # Required columns
                      required = ["article_id", "title", "source_domain"]
                      for col in required:
                          exists = col in df.columns
                          result.add_result(ExpectationResult(
                              exists, "column_exists", col,
                              {"found": exists}
                          ))
                      
                      # Null checks
                      for col in ["article_id", "title"]:
                          if col in df.columns:
                              null_count = df[col].isnull().sum()
                              result.add_result(ExpectationResult(
                                  null_count == 0, "not_null", col,
                                  {"null_count": int(null_count)}
                              ))
                      
                      # Uniqueness
                      if "article_id" in df.columns:
                          unique = df["article_id"].nunique() == len(df)
                          result.add_result(ExpectationResult(
                              unique, "unique", "article_id"
                          ))
                      
                      # Sentiment values
                      if "sentiment" in df.columns:
                          valid = {"positive", "negative", "neutral"}
                          invalid = df[~df["sentiment"].isin(valid)]["sentiment"].nunique()
                          result.add_result(ExpectationResult(
                              invalid == 0, "value_in_set", "sentiment",
                              {"invalid_count": int(invalid)}
                          ))
                      
                      # Row count
                      count = len(df)
                      result.add_result(ExpectationResult(
                          count >= 10, "min_row_count", None,
                          {"actual_count": count, "min_required": 10}
                      ))
                      
                      return result

              def generate_data_docs(result, output_dir="/tmp/data_docs"):
                  os.makedirs(output_dir, exist_ok=True)
                  
                  data_doc = {
                      "meta": {
                          "generated_at": datetime.now().isoformat(),
                          "suite_name": result.suite_name,
                          "generator_version": "1.0.0"
                      },
                      "summary": {
                          "success": result.success,
                          "run_time": result.run_time,
                          "statistics": result.statistics
                      },
                      "expectations": [r.to_dict() for r in result.results],
                      "failed_expectations": [r.to_dict() for r in result.results if not r.success]
                  }
                  
                  filename = f"data_docs_{datetime.now().strftime('%Y%m%d_%H%M%S')}.json"
                  filepath = os.path.join(output_dir, filename)
                  
                  with open(filepath, 'w') as f:
                      json.dump(data_doc, f, indent=2, default=str)
                  
                  print(f"📄 Data docs generated: {filepath}")
                  return filepath

              # Main execution
              print("="*60)
              print("🔍 GREAT EXPECTATIONS FORMAL CHECKPOINT")
              print("="*60)

              client = MongoClient('mongodb://mongodb:27017')
              db = client['news_analytics']

              articles = list(db.historical_articles.find({}, limit=5000))
              if not articles:
                  print("❌ No articles found!")
                  exit(1)

              df = pd.DataFrame(articles)
              print(f"📥 Loaded {len(df)} articles")

              # Run validation
              expectations = NewsDataExpectations("news_validation")
              result = expectations.validate(df)

              # Generate data docs
              docs_path = generate_data_docs(result)

              # Store in MongoDB
              db_rt = client['news_rt']
              doc_id = db_rt.data_quality_results.insert_one({
                  "suite_name": result.suite_name,
                  "run_time": datetime.now(),
                  "success": result.success,
                  "statistics": result.statistics,
                  "expectations": [r.to_dict() for r in result.results],
                  "data_docs_path": docs_path
              }).inserted_id
              print(f"📊 Results stored: {doc_id}")

              # Print summary
              stats = result.statistics
              print(f"\n{'='*60}")
              print("📋 VALIDATION SUMMARY")
              print(f"{'='*60}")
              print(f"{'✅ PASSED' if result.success else '❌ FAILED'}")
              print(f"Total: {stats['total_expectations']}")
              print(f"Passed: {stats['passed']}")
              print(f"Failed: {stats['failed']}")
              print(f"Success Rate: {stats['success_rate']:.1%}")

              for r in result.results:
                  icon = "✅" if r.success else "❌"
                  col = f"[{r.column}]" if r.column else "[table]"
                  print(f"   {icon} {r.expectation_type} {col}")

              print(f"{'='*60}")
              client.close()
              PYEND
      restartPolicy: Never
  backoffLimit: 2
