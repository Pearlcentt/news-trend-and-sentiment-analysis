---
# HDFS Deployment for Kubernetes
# Provides distributed storage for Lambda Architecture batch layer
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-config
  namespace: news-pipeline
data:
  CLUSTER_NAME: "news-cluster"
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://hdfs-namenode:9000</value>
      </property>
    </configuration>
  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>dfs.replication</name>
        <value>2</value>
      </property>
      <property>
        <name>dfs.namenode.name.dir</name>
        <value>/hadoop/dfs/name</value>
      </property>
      <property>
        <name>dfs.datanode.data.dir</name>
        <value>/hadoop/dfs/data</value>
      </property>
      <property>
        <name>dfs.permissions.enabled</name>
        <value>false</value>
      </property>
    </configuration>

---
# HDFS NameNode StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
  namespace: news-pipeline
spec:
  serviceName: "hdfs-namenode"
  replicas: 1
  selector:
    matchLabels:
      app: hdfs-namenode
  template:
    metadata:
      labels:
        app: hdfs-namenode
    spec:
      containers:
      - name: namenode
        image: apache/hadoop:3.3.6
        command: ["/bin/bash", "-c"]
        args:
          - |
            mkdir -p /hadoop/dfs/name
            if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
              hdfs namenode -format -force -nonInteractive
            fi
            hdfs namenode
        ports:
        - containerPort: 9000
          name: hdfs
        - containerPort: 9870
          name: webui
        env:
        - name: HADOOP_CONF_DIR
          value: /etc/hadoop
        volumeMounts:
        - name: hdfs-config
          mountPath: /etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: hdfs-config
          mountPath: /etc/hadoop/hdfs-site.xml
          subPath: hdfs-site.xml
        - name: namenode-data
          mountPath: /hadoop/dfs/name
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
      volumes:
      - name: hdfs-config
        configMap:
          name: hdfs-config
  volumeClaimTemplates:
  - metadata:
      name: namenode-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
  namespace: news-pipeline
spec:
  selector:
    app: hdfs-namenode
  ports:
  - name: hdfs
    port: 9000
    targetPort: 9000
  - name: webui
    port: 9870
    targetPort: 9870
  clusterIP: None

---
# HDFS DataNode StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode
  namespace: news-pipeline
spec:
  serviceName: "hdfs-datanode"
  replicas: 2
  selector:
    matchLabels:
      app: hdfs-datanode
  template:
    metadata:
      labels:
        app: hdfs-datanode
    spec:
      containers:
      - name: datanode
        image: apache/hadoop:3.3.6
        command: ["/bin/bash", "-c"]
        args:
          - |
            mkdir -p /hadoop/dfs/data
            # Wait for namenode
            until hdfs dfsadmin -report 2>/dev/null; do
              echo "Waiting for namenode..."
              sleep 5
            done
            hdfs datanode
        ports:
        - containerPort: 9864
          name: datanode
        - containerPort: 9866
          name: data
        env:
        - name: HADOOP_CONF_DIR
          value: /etc/hadoop
        volumeMounts:
        - name: hdfs-config
          mountPath: /etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: hdfs-config
          mountPath: /etc/hadoop/hdfs-site.xml
          subPath: hdfs-site.xml
        - name: datanode-data
          mountPath: /hadoop/dfs/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
      volumes:
      - name: hdfs-config
        configMap:
          name: hdfs-config
  volumeClaimTemplates:
  - metadata:
      name: datanode-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-datanode
  namespace: news-pipeline
spec:
  selector:
    app: hdfs-datanode
  ports:
  - name: datanode
    port: 9864
    targetPort: 9864
  - name: data
    port: 9866
    targetPort: 9866
  clusterIP: None
