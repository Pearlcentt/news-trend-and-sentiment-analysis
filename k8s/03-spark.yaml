apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: news-pipeline
data:
  SPARK_MODE: "master"
  SPARK_MASTER_HOST: "spark-master"
  SPARK_MASTER_PORT: "7077"
  SPARK_MASTER_WEBUI_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: news-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          mkdir -p /opt/spark/logs && /opt/spark/sbin/start-master.sh && sleep infinity
        ports:
        - containerPort: 7077
          name: spark
        - containerPort: 8080
          name: webui
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: news-pipeline
spec:
  selector:
    app: spark-master
  ports:
  - name: spark
    port: 7077
    targetPort: 7077
  - name: webui
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: news-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          mkdir -p /opt/spark/logs && sleep 15 && /opt/spark/sbin/start-worker.sh spark://spark-master:7077; while true; do sleep 3600; done
        ports:
        - containerPort: 8081
          name: webui
        env:
        - name: SPARK_WORKER_MEMORY
          value: "2G"
        - name: SPARK_WORKER_CORES
          value: "1"
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: news-pipeline
spec:
  selector:
    app: spark-worker
  ports:
  - port: 8081
    targetPort: 8081
