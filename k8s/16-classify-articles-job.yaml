apiVersion: batch/v1
kind: Job
metadata:
  name: classify-articles
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      containers:
      - name: classifier
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install pymongo --quiet
          python3 << 'PYEND'
          from pymongo import MongoClient
          from datetime import datetime
          import re

          # Category keywords
          CATEGORIES = {
              'Technology': ['tech', 'technology', 'AI', 'artificial intelligence', 'software', 'apple', 
                            'google', 'microsoft', 'amazon', 'startup', 'app', 'crypto', 'bitcoin',
                            'blockchain', 'computer', 'internet', 'digital', 'cyber', 'robot', 'data'],
              'Politics': ['politics', 'political', 'government', 'election', 'vote', 'president', 
                          'minister', 'congress', 'parliament', 'democrat', 'republican', 'law', 
                          'legislation', 'policy', 'diplomat', 'trump', 'biden', 'senate', 'white house'],
              'Business': ['business', 'economy', 'market', 'stock', 'trade', 'company', 'corporate',
                          'investment', 'finance', 'bank', 'revenue', 'profit', 'CEO', 'merger',
                          'acquisition', 'industry', 'retail', 'sales', 'earnings'],
              'Sports': ['sports', 'football', 'soccer', 'basketball', 'tennis', 'cricket', 'rugby',
                        'olympics', 'championship', 'league', 'match', 'game', 'player', 'team',
                        'coach', 'score', 'win', 'tournament', 'athlete', 'nba', 'nfl', 'fifa'],
              'Entertainment': ['entertainment', 'movie', 'film', 'music', 'celebrity', 'hollywood',
                               'tv', 'television', 'show', 'star', 'actor', 'actress', 'album',
                               'concert', 'streaming', 'netflix', 'disney', 'award'],
              'Science': ['science', 'research', 'study', 'scientist', 'discovery', 'space', 'nasa',
                         'climate', 'environment', 'health', 'medicine', 'disease', 'vaccine',
                         'biology', 'physics', 'chemistry', 'planet', 'galaxy'],
              'World': ['world', 'international', 'global', 'war', 'conflict', 'peace', 'military',
                       'army', 'troops', 'attack', 'terror', 'crisis', 'refugee', 'humanitarian',
                       'treaty', 'sanctions', 'nuclear'],
          }

          def classify_article(title, body=''):
              """Classify article based on keywords"""
              text = f"{title} {body}".lower()
              scores = {}
              
              for category, keywords in CATEGORIES.items():
                  score = sum(1 for kw in keywords if kw.lower() in text)
                  if score > 0:
                      scores[category] = score
              
              if scores:
                  return max(scores, key=scores.get)
              return 'General'

          print('='*60)
          print('ARTICLE CATEGORY CLASSIFIER')
          print('='*60)

          client = MongoClient('mongodb', 27017)
          db = client['news_analytics']
          collection = db['historical_articles']

          total = collection.count_documents({})
          print(f'Total articles to classify: {total}')

          # Classify all articles
          classified = 0
          category_counts = {}
          
          cursor = collection.find({})
          
          for doc in cursor:
              try:
                  title = doc.get('title', '')
                  body = doc.get('body_text', '')
                  
                  category = classify_article(title, body)
                  
                  # Update document
                  collection.update_one(
                      {'_id': doc['_id']},
                      {'$set': {
                          'category': category,
                          'classified_at': datetime.now().isoformat()
                      }}
                  )
                  
                  category_counts[category] = category_counts.get(category, 0) + 1
                  classified += 1
                  
                  if classified % 500 == 0:
                      print(f'Classified: {classified}/{total}')
                      
              except Exception as e:
                  print(f'Error: {e}')

          print(f'\n' + '='*60)
          print('CLASSIFICATION COMPLETE')
          print(f'Total classified: {classified}')
          print('\nCategory Distribution:')
          for cat, count in sorted(category_counts.items(), key=lambda x: x[1], reverse=True):
              pct = (count / classified * 100) if classified > 0 else 0
              print(f'  {cat}: {count} ({pct:.1f}%)')
          print('='*60)
          
          client.close()
          PYEND
      restartPolicy: Never
  backoffLimit: 2
