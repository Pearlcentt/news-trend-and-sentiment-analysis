# Historical Data Processing Job
# Processes historical articles: sentiment analysis and keyword extraction
# Uses jobs/batch/batch_pipeline.py for Spark-based processing
---
apiVersion: batch/v1
kind: Job
metadata:
  name: process-historical-data
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      containers:
        - name: processor
          image: bitnami/spark:3.5.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install pymongo pyyaml --quiet
              export PYTHONPATH="/opt/jobs"
              spark-submit \
                --master local[2] \
                --packages org.mongodb.spark:mongo-spark-connector_2.12:10.2.0 \
                --conf spark.mongodb.input.uri=mongodb://mongodb:27017/news_analytics.historical_articles \
                --conf spark.mongodb.output.uri=mongodb://mongodb:27017/news_analytics.processed_articles \
                /opt/jobs/batch/batch_pipeline.py \
                --config /opt/jobs/config/batch-config.yaml \
                --mode k8s
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
          volumeMounts:
            - name: jobs-code
              mountPath: /opt/jobs
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: jobs-code
          configMap:
            name: spark-jobs-code
      restartPolicy: Never
  backoffLimit: 2
