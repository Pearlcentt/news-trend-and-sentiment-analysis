apiVersion: batch/v1
kind: Job
metadata:
  name: process-historical-data
  namespace: news-pipeline
spec:
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      containers:
      - name: processor
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install pymongo --quiet
          python3 << 'PYEND'
          from pymongo import MongoClient
          from datetime import datetime
          import re

          # Sentiment lexicon
          POSITIVE_WORDS = ['good', 'great', 'excellent', 'positive', 'growth', 'surge', 'gain', 
                           'rise', 'success', 'profit', 'win', 'boost', 'improve', 'strong',
                           'advance', 'progress', 'breakthrough', 'milestone', 'achieve']
          NEGATIVE_WORDS = ['bad', 'decline', 'fall', 'drop', 'crisis', 'crash', 'loss', 'fail',
                           'negative', 'killed', 'death', 'attack', 'war', 'conflict', 'threat',
                           'danger', 'collapse', 'disaster', 'terror', 'violence', 'fear']

          def analyze_sentiment(text):
              if not text:
                  return 'neutral', 0.0
              text_lower = text.lower()
              pos_count = sum(1 for w in POSITIVE_WORDS if w in text_lower)
              neg_count = sum(1 for w in NEGATIVE_WORDS if w in text_lower)
              
              if pos_count > neg_count:
                  score = min(pos_count * 0.2, 1.0)
                  return 'positive', score
              elif neg_count > pos_count:
                  score = max(-neg_count * 0.2, -1.0)
                  return 'negative', score
              return 'neutral', 0.0

          def extract_keywords(text, n=5):
              if not text:
                  return []
              # Simple keyword extraction
              words = re.findall(r'\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\b', text)
              # Filter common words
              stopwords = {'The', 'This', 'That', 'These', 'Those', 'What', 'When', 'Where', 'Which'}
              keywords = [w for w in words if w not in stopwords and len(w) > 3]
              # Return unique keywords
              seen = set()
              unique = []
              for kw in keywords:
                  if kw.lower() not in seen:
                      seen.add(kw.lower())
                      unique.append(kw)
              return unique[:n]

          print('='*60)
          print('HISTORICAL DATA PROCESSOR')
          print('='*60)

          client = MongoClient('mongodb', 27017)
          db = client['news_analytics']
          collection = db['historical_articles']

          total = collection.count_documents({})
          print(f'Total articles to process: {total}')

          # Process in batches
          processed = 0
          batch_size = 100
          
          cursor = collection.find({})
          
          for doc in cursor:
              try:
                  title = doc.get('title', '')
                  body = doc.get('body_text', '')
                  full_text = f"{title} {body}"
                  
                  # Analyze sentiment
                  sentiment, score = analyze_sentiment(full_text)
                  
                  # Extract keywords
                  keywords = extract_keywords(full_text)
                  
                  # Update document
                  collection.update_one(
                      {'_id': doc['_id']},
                      {'$set': {
                          'sentiment': sentiment,
                          'sentiment_score': score,
                          'keywords': keywords,
                          'processed_at': datetime.now().isoformat(),
                          'is_processed': True
                      }}
                  )
                  
                  processed += 1
                  if processed % 500 == 0:
                      print(f'Processed: {processed}/{total}')
                      
              except Exception as e:
                  print(f'Error processing doc: {e}')

          print(f'\n' + '='*60)
          print(f'PROCESSING COMPLETE')
          print(f'Total processed: {processed}')
          
          # Stats
          pos_count = collection.count_documents({'sentiment': 'positive'})
          neg_count = collection.count_documents({'sentiment': 'negative'})
          neu_count = collection.count_documents({'sentiment': 'neutral'})
          
          print(f'Positive: {pos_count}')
          print(f'Negative: {neg_count}')
          print(f'Neutral: {neu_count}')
          print('='*60)
          
          client.close()
          PYEND
      restartPolicy: Never
  backoffLimit: 2
