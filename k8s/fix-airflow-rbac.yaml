apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: news-pipeline
  name: airflow-pod-manager-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs:
      ["get", "list", "watch", "create", "delete", "deletecollection", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-manager-binding
  namespace: news-pipeline
subjects:
  - kind: ServiceAccount
    name: default
    namespace: news-pipeline
roleRef:
  kind: Role
  name: airflow-pod-manager-role
  apiGroup: rbac.authorization.k8s.io
