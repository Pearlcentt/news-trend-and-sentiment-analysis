# Crawler settings
crawler:
  poll_interval_seconds: 60  # Fast polling for Big Data demo
  request_timeout: 15
  max_retries: 3
  state_store: "/app/state/crawler_state.json"
  default_country: "US"
  default_feed_name: "general"
  schema_version: 3
  concurrent_feeds: 5  # Process 5 feeds concurrently
  max_articles_per_feed: 50  # Max articles per feed per cycle

# Kafka settings
kafka:
  bootstrap_servers: "kafka-broker:9092"
  topic: "news_raw"
  client_id: "news-crawler-extended"
  security_protocol: "PLAINTEXT"
  batch_size: 16384
  linger_ms: 10

# Schema Registry
schema_registry:
  url: "http://sr-service:8081"
  subject: "news_raw-value"
  schema_path: "/app/schemas/news_raw.avsc"
