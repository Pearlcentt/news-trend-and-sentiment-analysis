kafka:
  bootstrap_servers: "kafka-broker:9092"
  input_topic: "news_raw"
  output_topic: "news_processed"
  starting_offsets: "latest"
schemas:
  # These paths work in K8s when mounted from ConfigMap
  # For local: override via environment or use absolute paths
  news_raw: "/tmp/jobs/schemas/news_raw.avsc"
  news_processed: "/tmp/jobs/schemas/news_processed.avsc"
  processed_schema_version: 2
spark:
  shuffle_partitions: 4
  log_level: "WARN"
  adaptive_enabled: false
  auto_broadcast_join_threshold: 134217728
streaming:
  watermark: "5 minutes"
  window_duration: "10 minutes"
  window_slide: "5 minutes"
  # Local checkpoints (works in K8s and local)
  checkpoint_news_processed: "/tmp/checkpoints/news_processed"
  checkpoint_rt_trends: "/tmp/checkpoints/rt_trends"
  checkpoint_rt_sentiment: "/tmp/checkpoints/rt_sentiment"
  checkpoint_rt_topic_pivot: "/tmp/checkpoints/rt_topic_pivot"
  checkpoint_rt_topic_totals: "/tmp/checkpoints/rt_topic_totals"
mongo:
  uri: "mongodb://mongodb:27017"
  database: "news_rt"
reference_data:
  source_metadata: "/tmp/jobs/source_metadata.json"
